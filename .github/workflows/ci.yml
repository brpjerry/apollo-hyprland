---
# Builds the Arch Linux package (packaging/linux/Arch/PKGBUILD) with makepkg, runs the unit tests in its check(), and
# runs the live compositor tests against a headless Hyprland. release.yml calls this workflow to build release packages.
name: CI
permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  organization:
    uses: LizardByte/.github/.github/workflows/__call-organization.yml@master

  github-env:
    name: GitHub Env Debug
    permissions:
      contents: read
    uses: LizardByte/.github/.github/workflows/__call-github-env.yml@master

  release-setup:
    needs: organization
    name: Release Setup
    outputs:
      publish_release: >-
        ${{ needs.organization.outputs.allowed == 'true' &&
        steps.release-setup.outputs.publish_release == 'true' }}
      release_body: ${{ steps.release-setup.outputs.release_body }}
      release_commit: ${{ steps.release-setup.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.release-setup.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.release-setup.outputs.release_tag }}
      release_version: ${{ steps.release-setup.outputs.release_version }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The CUDA toolkit alone is several GiB installed; the runner's preinstalled SDKs are not needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      # makepkg clones this checkout, so it needs the history of the commit; it fetches the submodules itself.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w archlinux:latest scripts/ci/arch-package.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
          if-no-files-found: error

      # The live job runs on the host VM (it needs /dev/dri), so hand it the test binary.
      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: test-binary
          path: dist/tests/test_sunshine
          retention-days: 3

  # Installs the package into a fresh container the way a user would, and checks that it starts.
  install_check:
    name: Install check
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist

      - name: Install and run
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/dist:/dist:ro" archlinux:base bash -euo pipefail -c '
            pacman -Syu --noconfirm
            pacman -U --noconfirm /dist/*.pkg.tar.zst
            pacman -Qk "$(pacman -Qqp /dist/*.pkg.tar.zst)"
            useradd --create-home tester
            su tester -c "cd /tmp && sunshine --version"
          '

  # Runs the *LiveTest suites against a private headless Hyprland (scripts/hyprland/test-live.sh).
  # Hyprland 0.57 cannot run without a DRM device, even with only headless outputs, and the runners have no GPU, so this
  # loads vkms (a virtual KMS device; Mesa renders on it in software) on the host and passes /dev/dri to an Arch
  # container. If vkms cannot be loaded the tests are skipped with a warning.
  # continue-on-error: the vkms + llvmpipe path has not been verified on GitHub's runners yet (locally the harness runs
  # on a GPU render node). Remove it once this job has been green on a few PRs.
  live_hyprland:
    name: Live Hyprland tests (headless)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Release Setup
        id: release-setup
        uses: LizardByte/actions/actions/release_setup@81873587bacc6842098865a35bbb32f2f21cee3b  # v2026.1123.33249
        with:
          name: test-binary
          path: build/tests

  build-docker:
    name: Docker
    needs: release-setup
    permissions:
      contents: read
      packages: write
    uses: LizardByte/.github/.github/workflows/__call-docker.yml@master
    with:
      docker_hub_username: ${{ vars.DOCKER_HUB_USERNAME }}
      gh_bot_name: ${{ vars.GH_BOT_NAME }}
      maximize_build_space: true
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_tag: ${{ needs.release-setup.outputs.release_tag }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-freebsd:
    name: FreeBSD
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-freebsd.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-homebrew:
    name: Homebrew
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-homebrew.yml
    with:
      git_username: ${{ vars.GH_BOT_NAME }}
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_tag: ${{ needs.release-setup.outputs.release_tag }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      GIT_EMAIL: ${{ secrets.GH_BOT_EMAIL }}

  build-macos:
    name: macOS
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: >-
        ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD: >-
        ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}

  build-linux:
    name: Linux
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-linux.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-archlinux:
    name: Archlinux
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-archlinux.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-alpine:
    name: Alpine
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-alpine.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-linux-copr:
    name: Linux Copr
    if: github.event_name != 'push'  # releases are handled directly in ci-release.yml
    needs: release-setup
    permissions:
      contents: write  # needed to update releases
    uses: ./.github/workflows/ci-copr.yml
    secrets:
      COPR_BETA_WEBHOOK_TOKEN: ${{ secrets.COPR_BETA_WEBHOOK_TOKEN }}
      COPR_STABLE_WEBHOOK_TOKEN: ${{ secrets.COPR_STABLE_WEBHOOK_TOKEN }}
      COPR_CLI_CONFIG: ${{ secrets.COPR_CLI_CONFIG }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  build-linux-flatpak:
    name: Linux Flatpak
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-flatpak.yml
    with:
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}

  build-windows:
    name: Windows
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      azure_signing_account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      azure_signing_cert_profile: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
      azure_signing_endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      publish_release: ${{ needs.release-setup.outputs.publish_release }}
      release_commit: ${{ needs.release-setup.outputs.release_commit }}
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  test-powershell:
    name: PowerShell
    permissions:
      contents: read
    uses: ./.github/workflows/ci-powershell.yml

  web-ui:
    name: Web UI
    needs: release-setup
    permissions:
      contents: read
    uses: ./.github/workflows/ci-web.yml
    with:
      release_version: ${{ needs.release-setup.outputs.release_version }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    name: Coverage-${{ matrix.name }}
    if: >-
      always() &&
      !cancelled() &&
      needs.organization.outputs.allowed == 'true'
    needs:
      - organization
      - build-freebsd
      - build-linux
      - build-archlinux
      - build-alpine
      - build-linux-flatpak
      - build-macos
      - build-homebrew
      - build-windows
      - test-powershell
      - web-ui
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD-amd64
            coverage: true
          - name: Linux-AppImage-aarch64
            coverage: true
          - name: Linux-AppImage-x86_64
            coverage: true
          - name: Archlinux
            coverage: true
          - name: Alpine-x86_64
            coverage: true
          - name: Alpine-aarch64
            coverage: true
          - name: macOS-arm64
            coverage: true
          - name: macOS-x86_64
            coverage: true
          - name: Homebrew-macos-15
            coverage: true
            coverage_file: coverage.lcov
          - name: Homebrew-macos-26
            coverage: true
            coverage_file: coverage.lcov
          - name: Homebrew-ubuntu-24.04
            coverage: true
          - name: Windows-AMD64
            coverage: true
          - name: Windows-ARM64
            coverage: true
          - name: PowerShell
            coverage: true
          - name: Web-UI
            coverage: true
            coverage_file: coverage/coverage-final.json
            test_results_file: junit.xml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-${{ matrix.name }}
          path: _coverage

      - name: Upload test coverage
        if: matrix.coverage != false
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_coverage/${{ matrix.coverage_file || 'coverage.xml' }}
          report_type: coverage
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_coverage/${{ matrix.test_results_file || 'tests/test_results.xml' }}
          report_type: test_results
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  release:
    name: Release
    if:
      needs.release-setup.outputs.publish_release == 'true' &&
      needs.organization.outputs.allowed == 'true'
    needs:
      - organization
      - release-setup
      - build-archlinux
      - build-alpine
      - build-docker
      - build-freebsd
      - build-homebrew
      - build-linux
      - build-linux-flatpak
      - build-macos
      - build-windows
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Debug artifacts
        run: ls -l artifacts

      - name: Create/Update GitHub Release
        uses: LizardByte/actions/actions/release_create@81873587bacc6842098865a35bbb32f2f21cee3b  # v2026.1123.33249
        with:
          allowUpdates: false
          body: ${{ needs.release-setup.outputs.release_body }}
          generateReleaseNotes: ${{ needs.release-setup.outputs.release_generate_release_notes }}
          name: ${{ needs.release-setup.outputs.release_tag }}
          prerelease: true
          tag: ${{ needs.release-setup.outputs.release_tag }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          virustotal_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}

  release-homebrew-beta:
    name: Release Homebrew Beta
    if:
      needs.release-setup.outputs.publish_release == 'true' &&
      needs.organization.outputs.allowed == 'true'
    needs:
      - organization
      - release-setup
      - build-homebrew
      - release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download homebrew artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: beta-Homebrew
          path: homebrew

      - name: Upload Homebrew Beta Formula
        uses: LizardByte/actions/actions/release_homebrew@master  # action requires too many updates to pin
        with:
          actionlint_config: "---\n# empty config"
          formula_file: ${{ github.workspace }}/homebrew/sunshine-beta.rb
          git_email: ${{ secrets.GH_BOT_EMAIL }}
          git_username: ${{ vars.GH_BOT_NAME }}
          publish: true
          token: ${{ secrets.GH_BOT_TOKEN }}
          validate: false
